name: EczemaTwin
options:
  bundleIdPrefix: com.jackyzhong
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  EczemaKit:
    path: Packages/EczemaKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 35AD3DPH6Y
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EczemaTwin:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
      - path: Shared
    dependencies:
      - package: EczemaKit
      - target: EczemaTwinWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyzhong.eczematwin2
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: App/iOS/iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: SkinXAI
        CFBundleVersion: "25"
        UILaunchScreen: {}
        # Wins over UILaunchScreen: the app's first frame (App/iOS/Shell/LaunchScreen.storyboard).
        UILaunchStoryboardName: LaunchScreen
        # Portrait everywhere; the live monitor turns the phone to landscape (OrientationLock in the app).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [SpaceGrotesk.ttf, SpaceMono-Regular.ttf, SpaceMono-Bold.ttf]
        NSHealthShareUsageDescription: SkinXAI reads your sleep and heart data to understand your flares.
        NSHealthUpdateUsageDescription: SkinXAI saves nothing to Health.
        NSLocationWhenInUseUsageDescription: SkinXAI uses your location for local humidity, air quality and pollen.
  EczemaTwinWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
      - path: Shared
    dependencies:
      - package: EczemaKit
    configFiles:
      Debug: App/Watch/Live.xcconfig
      Release: App/Watch/Live.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackyzhong.eczematwin2.watchkitapp
        SKIP_INSTALL: YES
    entitlements:
      path: App/Watch/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: SkinXAI
        CFBundleVersion: "25"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jackyzhong.eczematwin2
        WKBackgroundModes: [workout-processing, physical-therapy]
        TwinLiveHost: $(TWIN_LIVE_HOST)
        TwinLiveKey: $(TWIN_LIVE_KEY)
        UIAppFonts: [SpaceGrotesk.ttf, SpaceMono-Regular.ttf, SpaceMono-Bold.ttf]
        NSMotionUsageDescription: SkinXAI reads wrist motion to detect scratching.
        NSHealthShareUsageDescription: SkinXAI keeps a workout session so it can detect scratching in the background.
        NSHealthUpdateUsageDescription: SkinXAI keeps a workout session so it can detect scratching in the background.
